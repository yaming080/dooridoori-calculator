<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DooriDoori 암호화폐 총 보유가치 계산기</title>
    <style>
      /* Reset and basic typography */
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: Arial, sans-serif;
        background-color: #f9f9f9;
        color: #333;
        line-height: 1.6;
        padding: 20px;
      }
      header {
        text-align: center;
        margin-bottom: 12px;
      }
      header img {
        /* Use the wide DooriDoori banner logo */
        max-width: 980px;
        max-width: 92vw;
        width: auto;
        height: 60px;
        max-height: 60px;
        object-fit: contain;
      }

      @media (max-width: 480px) {
        header img {
          height: 44px;
          max-height: 44px;
        }
      }
      h1 {
        font-size: 1.6rem;
        margin-top: 10px;
      }
      /* Responsive layout: small screens stack columns */
      form {
        max-width: 900px;
        margin: 0 auto;
        background-color: #ffffff;
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      }
      .controls {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 15px;
      }
      .controls label {
        margin-right: 8px;
        font-weight: bold;
      }
      .controls select {
        padding: 4px 8px;
        border: 1px solid #ccc;
        border-radius: 4px;
      }
      .countdown {
        font-size: 0.9rem;
        color: #555;
        margin-top: 5px;
      }
      .section-head {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 12px;
        flex-wrap: wrap;
      }
      .coin-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 10px;
        margin-bottom: 15px;
      }
      .coin-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
      }
      .coin-row label {
        flex: 0 0 150px;
      }
      .coin-row input {
        flex: 1;
        padding: 5px 10px;
        border: 1px solid #ccc;
        border-radius: 4px;
        font-size: 1rem;
      }
      .change-box {
        display: flex;
        align-items: center;
        gap: 5px;
        flex: 0 0 auto;
        min-width: 0;
      }
      .change-box input {
        width: 170px;
        flex: 0 0 170px;
        min-width: 0;
      }
      .change-box select {
        width: 70px;
        flex: 0 0 70px;
        padding: 5px 4px;
        border: 1px solid #ccc;
        border-radius: 4px;
        background: #fff;
      }
      .save-status {
        min-height: 20px;
        margin-top: 8px;
        text-align: center;
        font-size: 0.9rem;
        color: #2e7d32;
        font-weight: bold;
      }
      .actions {
        display: grid;
        grid-template-columns: repeat(2, minmax(90px, 130px));
        justify-content: center;
        gap: 8px;
        margin-top: 10px;
      }
      .actions button {
        padding: 8px 14px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-size: 0.9rem;
        color: #fff;
      }
      .btn-primary {
        background-color: #4caf50;
      }
      .btn-primary:hover {
        background-color: #45a049;
      }
      .btn-secondary {
        background-color: #888;
      }
      .btn-secondary:hover {
        background-color: #777;
      }
      .results-section {
        margin-top: 20px;
        max-width: 900px;
        margin-left: auto;
        margin-right: auto;
      }
      .results-section h2 {
        margin-bottom: 8px;
        font-size: 1.3rem;
      }
      .results-table {
        width: 100%;
        border-collapse: collapse;
        margin-bottom: 20px;
      }
      .results-table th,
      .results-table td {
        border: 1px solid #ddd;
        padding: 6px 8px;
        text-align: right;
      }
      .results-table th {
        background-color: #f0f0f0;
        text-align: center;
      }
      .results-table td:first-child,
      .results-table th:first-child {
        text-align: left;
      }

      /* Responsive adjustments for mobile */
      @media (max-width: 600px) {
        .controls {
          flex-direction: column;
          align-items: flex-start;
        }
        .controls .countdown {
          margin-top: 8px;
        }
        .coin-grid {
          grid-template-columns: 1fr;
        }
        .coin-row {
          flex-direction: column;
          align-items: stretch;
        }
        .coin-row label {
          flex: unset;
        }
        .change-box {
          min-width: 0;
          width: 100%;
        }
        .change-box input {
          min-width: 0;
        }
        .change-box {
          width: 100%;
        }
        .change-box input {
          width: 100%;
          flex: 1 1 auto;
        }
        .change-box select {
          width: 70px;
          flex: 0 0 70px;
        }
        .actions {
          grid-template-columns: repeat(2, minmax(0, 1fr));
          gap: 6px;
        }
        .actions button {
          width: 100%;
        }
        .results-section table {
          font-size: 0.85rem;
        }
        .results-section {
          overflow-x: auto;
        }
      }
      .footer {
        text-align: center;
        margin-top: 30px;
        font-size: 0.9rem;
        color: #666;
      }
    </style>
  </head>
  <body>
    <header>
      <!-- Embed logo to avoid missing-file issues on some hosts -->
      <img id="brandLogo" alt="DooriDoori 로고" style="max-width: 520px; width: 70%; height: auto;" />
      <h1>암호화폐 총 보유가치 계산기</h1>
    </header>
    <!-- Controls for currency selection and countdown -->
    <form id="crypto-form">
      <div class="controls">
        <div>
          <label for="currencySelect">통화 선택:</label>
          <select id="currencySelect">
            <option value="KRW">KRW (원)</option>
            <option value="USD">USD ($)</option>
          </select>
        </div>
        <!-- status moved to the "현재 보유가치" 영역으로 이동 -->
      </div>
      <!-- Input fields for coin quantities -->
      <div class="coin-grid">
        <div class="coin-row">
          <label for="btc">비트코인 (BTC)</label>
          <input type="number" id="btc" name="btc" step="0.00000001" placeholder="0" />
        </div>
        <div class="coin-row">
          <label for="eth">이더리움 (ETH)</label>
          <input type="number" id="eth" name="eth" step="0.00000001" placeholder="0" />
        </div>
        <div class="coin-row">
          <label for="xrp">리플 (XRP)</label>
          <input type="number" id="xrp" name="xrp" step="0.0001" placeholder="0" />
        </div>
        <div class="coin-row">
          <label for="xlm">스텔라 (XLM)</label>
          <input type="number" id="xlm" name="xlm" step="0.0001" placeholder="0" />
        </div>
        <div class="coin-row">
          <label for="ada">에이다 (ADA)</label>
          <input type="number" id="ada" name="ada" step="0.0001" placeholder="0" />
        </div>
        <div class="coin-row">
          <label for="trx">트론 (TRX)</label>
          <input type="number" id="trx" name="trx" step="0.0001" placeholder="0" />
        </div>
        <div class="coin-row">
          <label for="etc">이더리움클래식 (ETC)</label>
          <input type="number" id="etc" name="etc" step="0.0001" placeholder="0" />
        </div>
        <div class="coin-row">
          <label for="bch">비트코인캐시 (BCH)</label>
          <input type="number" id="bch" name="bch" step="0.0001" placeholder="0" />
        </div>
        <div class="coin-row">
          <label for="bnb">바이낸스코인 (BNB)</label>
          <input type="number" id="bnb" name="bnb" step="0.0001" placeholder="0" />
        </div>
        <div class="coin-row">
          <label for="shib">시바이누 (SHIB)</label>
          <input type="number" id="shib" name="shib" step="1" placeholder="0" />
        </div>
      </div>
      <!-- Action buttons -->
      <div class="actions actions-2x2">
        <button type="button" id="saveBtn" class="btn-secondary">저장</button>
        <button type="button" id="applyAllBtn" class="btn-secondary">적용</button>
        <button type="button" id="loadBtn" class="btn-secondary">불러오기</button>
        <button type="button" id="resetBtn" class="btn-secondary">초기화</button>
      </div>
      <div id="saveStatus" class="save-status" aria-live="polite"></div>
    </form>
    <!-- Results section -->
    <div class="results-section">
      <div class="section-head">
        <h2>현재 보유가치 (실시간)</h2>
        <div class="countdown" aria-live="polite">
          <span id="status-text">실시간 자동 시세 갱신중</span>
          (<span id="countdown">30</span>초)
        </div>
      </div>
      <table class="results-table" id="currentTable">
        <thead>
          <tr>
            <th>코인</th>
            <th>보유 수량</th>
            <th>현재가</th>
            <th>가치</th>
          </tr>
        </thead>
        <tbody id="currentBody">
          <!-- Dynamic rows inserted here -->
        </tbody>
        <tfoot>
          <tr>
            <th colspan="3">합계</th>
            <th id="currentTotal" style="text-align:right;"></th>
          </tr>
        </tfoot>
      </table>
      <!-- Historical comparison tables -->
      <h2 id="grandSlamTitle">DooriDoori 그랜드 슬램 비교 (가족인원수 1명 기준)</h2>
      <table class="results-table" id="historyTable">
        <thead>
          <tr>
            <th rowspan="2">코인</th>
            <th rowspan="2">보유 수량</th>
            <th colspan="2">2019년 12월 종가</th>
            <th colspan="2">2023년 12월 종가</th>
          </tr>
          <tr>
            <th>가격</th>
            <th>가치</th>
            <th>가격</th>
            <th>가치</th>
          </tr>
        </thead>
        <tbody id="historyBody">
          <!-- Rows will be populated by JS -->
        </tbody>
        <tfoot>
          <tr>
            <!-- Sum row: 2019 total aligned under the 2019 value column (4th column), 2023 total under the 6th column -->
            <th>합계</th>
            <td></td>
            <td></td>
            <td id="historyTotal2019"></td>
            <td></td>
            <td id="historyTotal2023"></td>
          </tr>
        </tfoot>
      </table>
    </div>
    <div class="footer">
      <p>본 계산기는 실시간 시세를 기반으로 하며, DooriDoori에서 제공되었습니다.</p>
    </div>

      /**
       * Formats a number according to currency.
       * For KRW: no decimal places and thousand separators.
       * For USD: two decimal places and thousand separators.
       */
      function formatCurrency(num, currency) {
        if (currency === 'KRW') {
          // For KRW, normally no decimals, but show two decimals for values below 1 to avoid rounding to zero
          if (Math.abs(num) < 1) {
            return num.toLocaleString('ko-KR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
          }
          return num.toLocaleString('ko-KR', { maximumFractionDigits: 0 });
        } else {
          // For USD, show more precision for very small values (below $0.01)
          if (Math.abs(num) < 0.01) {
            return num.toLocaleString('en-US', { minimumFractionDigits: 6, maximumFractionDigits: 8 });
          }
          return num.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }
      }

      // Price formatter (special case: SHIB in KRW should show 3 decimals)
      function formatPrice(num, currency, coin) {
        if (coin === 'SHIB' && currency === 'KRW') {
          return num.toLocaleString('ko-KR', {
            minimumFractionDigits: 3,
            maximumFractionDigits: 3,
          });
        }
        return formatCurrency(num, currency);
      }

      // ------------------------------
      // Persist user inputs (localStorage)
      // ------------------------------
      const STORAGE_KEY = 'dooridoori_holdings_v1';

      function saveInputsToStorage() {
        try {
          const payload = {
            currency: document.getElementById('currencySelect').value,
            values: {
              btc: document.getElementById('btc').value || '',
              eth: document.getElementById('eth').value || '',
              xrp: document.getElementById('xrp').value || '',
              xlm: document.getElementById('xlm').value || '',
              ada: document.getElementById('ada').value || '',
              trx: document.getElementById('trx').value || '',
              etc: document.getElementById('etc').value || '',
              bch: document.getElementById('bch').value || '',
              bnb: document.getElementById('bnb').value || '',
              shib: document.getElementById('shib').value || '',
            },
            savedAt: Date.now(),
          };
          localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
        } catch (e) {
          // ignore (private mode, storage disabled, etc.)
        }
      }

      function loadInputsFromStorage() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return false;
          const payload = JSON.parse(raw);
          if (payload?.currency === 'USD' || payload?.currency === 'KRW') {
            document.getElementById('currencySelect').value = payload.currency;
          }
          const v = payload?.values || {};
          ['btc','eth','xrp','xlm','ada','trx','etc','bch','bnb','shib'].forEach((id) => {
            if (typeof v[id] === 'string' && v[id] !== '') {
              document.getElementById(id).value = v[id];
            }
          });
          return true;
        } catch (e) {
          return false;
        }
      }

      function clearStorage() {
        try {
          localStorage.removeItem(STORAGE_KEY);
        } catch (e) {
          // ignore
        }
      }

        XLM: '스텔라',

      };

      const inputIds = ['btc','eth','xrp','xlm','ada','trx','etc','bch','bnb','shib'];

      function showSaveStatus(message = '저장됨') {
        const el = document.getElementById('saveStatus');
        if (!el) return;
        el.textContent = message;
        if (window._saveStatusTimer) clearTimeout(window._saveStatusTimer);
        window._saveStatusTimer = setTimeout(() => {
          el.textContent = '';
        }, 2400);
      }

      function normalizeNumberValue(value) {
        const num = parseFloat(value);
        if (!Number.isFinite(num)) return 0;
        return num;
      }

      function writeNumberInput(id, value) {
        const el = document.getElementById(id);
        if (!el) return;
        const rounded = Math.round((value + Number.EPSILON) * 100000000) / 100000000;
        el.value = String(rounded);
      }

      function buildChangeControls() {
        inputIds.forEach((id) => {
          const currentInput = document.getElementById(id);
          if (!currentInput || currentInput.dataset.changeReady === '1') return;
          currentInput.dataset.changeReady = '1';

          const box = document.createElement('div');
          box.className = 'change-box';
          box.innerHTML = `
            <input type="number" id="change_${id}" step="any" min="0" value="0" aria-label="${id.toUpperCase()} 변경 수량" />
            <select id="op_${id}" aria-label="${id.toUpperCase()} 추가 또는 차감 선택">
              <option value="add">추가</option>
              <option value="sub">차감</option>
            </select>
          `;
          currentInput.parentElement.appendChild(box);
        });
      }

      function applyQuantityChange(id) {
        const currentEl = document.getElementById(id);
        const changeEl = document.getElementById(`change_${id}`);
        const opEl = document.getElementById(`op_${id}`);
        if (!currentEl || !changeEl || !opEl) return;

        const current = normalizeNumberValue(currentEl.value);
        const change = normalizeNumberValue(changeEl.value);
        if (change <= 0) {
          showSaveStatus('변경 수량을 입력해 주세요');
          return;
        }

        let next = current;
        if (opEl.value === 'sub') {
          if (change > current) {
            alert('보유 수량보다 많이 차감할 수 없습니다.');
            return;
          }
          next = current - change;
        } else {
          next = current + change;
        }

        writeNumberInput(id, next);
        changeEl.value = '0';
        updateCurrentTable();
        showSaveStatus('적용됨 · 저장하려면 저장 버튼을 누르세요');
      }

      function applyAllQuantityChanges() {
        let changed = false;

        for (const id of inputIds) {
          const currentEl = document.getElementById(id);
          const changeEl = document.getElementById(`change_${id}`);
          const opEl = document.getElementById(`op_${id}`);
          if (!currentEl || !changeEl || !opEl) continue;

          const current = normalizeNumberValue(currentEl.value);
          const change = normalizeNumberValue(changeEl.value);
          if (change <= 0) continue;

          if (opEl.value === 'sub' && change > current) {
            alert(`${currentEl.closest('.coin-row')?.querySelector('label')?.textContent || id.toUpperCase()} 보유 수량보다 많이 차감할 수 없습니다.`);
            return;
          }

          const next = opEl.value === 'sub' ? current - change : current + change;
          writeNumberInput(id, next);
          changeEl.value = '0';
          changed = true;
        }

        if (!changed) {
          showSaveStatus('변경 수량을 입력해 주세요');
          return;
        }

        updateCurrentTable();
        showSaveStatus('적용됨 · 저장하려면 저장 버튼을 누르세요');
      }

      /**
       * Populates the historical comparison table based on the selected currency.
       */
      function updateHistoricalTables() {
        const currency = document.getElementById('currencySelect').value;
        const tbody = document.getElementById('historyBody');
        tbody.innerHTML = '';
        let total2019 = 0;
        let total2023 = 0;

        Object.keys(quantityMap).forEach((coin) => {
          const qty = quantityMap[coin];
          let price19 = price2019USD[coin];
          let price23 = price2023USD[coin];
          if (currency === 'KRW') {
            price19 = price19 * usdToKrw2019;
            price23 = price23 * usdToKrw2023;
          }
          const value19 = qty * price19;
          const value23 = qty * price23;
          total2019 += value19;
          total2023 += value23;
          const tr = document.createElement('tr');
          // Determine suffix based on currency
          const suffix = currency === 'KRW' ? ' 원' : ' USD';
          tr.innerHTML = `
            <td>${coinNames[coin]} (${coin})</td>
            <td>${qty.toLocaleString()}</td>
            <td>${formatPrice(price19, currency, coin)}${suffix}</td>
            <td>${formatCurrency(value19, currency)}${suffix}</td>
            <td>${formatPrice(price23, currency, coin)}${suffix}</td>
            <td>${formatCurrency(value23, currency)}${suffix}</td>
          `;
          tbody.appendChild(tr);
        });
        const suffix = currency === 'KRW' ? ' 원' : ' USD';
        document.getElementById('historyTotal2019').textContent = `${formatCurrency(total2019, currency)}${suffix}`;
        document.getElementById('historyTotal2023').textContent = `${formatCurrency(total2023, currency)}${suffix}`;
      }

      // ------------------------------
      // Real-time price fetching logic
      // ------------------------------
      /**
       * Fetches current prices for all supported coins.
       * Returns an object with KRW and USD prices for each coin.
       */
      async function fetchCurrentPrices() {
        try {
          // 1) Fetch USD prices for all coins from Binance (USDT pairs).
          //    This avoids CORS proxy issues and works on most static hosts.
          const symbolList = ['BTCUSDT','ETHUSDT','XRPUSDT','XLMUSDT','ADAUSDT','TRXUSDT','ETCUSDT','BCHUSDT','BNBUSDT','SHIBUSDT'];
          const binanceUrl = `https://api.binance.com/api/v3/ticker/price?symbols=${encodeURIComponent(JSON.stringify(symbolList))}`;
          const binanceRes = await fetch(binanceUrl);
          const binanceData = await binanceRes.json();
          const usdMap = {};
          for (const row of binanceData) {
            usdMap[row.symbol] = parseFloat(row.price);
          }

          // 2) Fetch USD->KRW exchange rate (for KRW display).
          //    open.er-api.com supports CORS and is lightweight.
          const fxRes = await fetch('https://open.er-api.com/v6/latest/USD');
          const fxJson = await fxRes.json();
          const usdToKrw = fxJson && fxJson.rates && fxJson.rates.KRW ? fxJson.rates.KRW : 1300;

          const prices = {
            BTC: { USD: usdMap.BTCUSDT || 0, KRW: (usdMap.BTCUSDT || 0) * usdToKrw },
            ETH: { USD: usdMap.ETHUSDT || 0, KRW: (usdMap.ETHUSDT || 0) * usdToKrw },
            XRP: { USD: usdMap.XRPUSDT || 0, KRW: (usdMap.XRPUSDT || 0) * usdToKrw },
            XLM: { USD: usdMap.XLMUSDT || 0, KRW: (usdMap.XLMUSDT || 0) * usdToKrw },
            ADA: { USD: usdMap.ADAUSDT || 0, KRW: (usdMap.ADAUSDT || 0) * usdToKrw },
            TRX: { USD: usdMap.TRXUSDT || 0, KRW: (usdMap.TRXUSDT || 0) * usdToKrw },
            ETC: { USD: usdMap.ETCUSDT || 0, KRW: (usdMap.ETCUSDT || 0) * usdToKrw },
            BCH: { USD: usdMap.BCHUSDT || 0, KRW: (usdMap.BCHUSDT || 0) * usdToKrw },
            BNB: { USD: usdMap.BNBUSDT || 0, KRW: (usdMap.BNBUSDT || 0) * usdToKrw },
            SHIB:{ USD: usdMap.SHIBUSDT || 0, KRW: (usdMap.SHIBUSDT || 0) * usdToKrw },
          };
          return prices;
        } catch (err) {
          console.error('Error fetching current prices', err);
          return null;
        }
      }

      /**
       * Stores the most recently fetched prices so that user input can update
       * immediately without an additional API call.
       */
      let lastPrices = null;

      /**
       * Updates the current holdings table based on user input and provided prices.
       * If pricesParam is undefined, uses the lastPrices cache.
       * @param {Object} pricesParam Optional price map with KRW and USD values
       */
      function updateCurrentTable(pricesParam) {
        const prices = pricesParam || lastPrices;
        if (!prices) return;
        const currency = document.getElementById('currencySelect').value;
        const tbody = document.getElementById('currentBody');
        tbody.innerHTML = '';
        let totalValue = 0;
        // Gather input quantities
        const inputs = {
          BTC: parseFloat(document.getElementById('btc').value) || 0,
          ETH: parseFloat(document.getElementById('eth').value) || 0,
          XRP: parseFloat(document.getElementById('xrp').value) || 0,
          XLM: parseFloat(document.getElementById('xlm').value) || 0,
          ADA: parseFloat(document.getElementById('ada').value) || 0,
          TRX: parseFloat(document.getElementById('trx').value) || 0,
          ETC: parseFloat(document.getElementById('etc').value) || 0,
          BCH: parseFloat(document.getElementById('bch').value) || 0,
          BNB: parseFloat(document.getElementById('bnb').value) || 0,
          SHIB: parseFloat(document.getElementById('shib').value) || 0,
        };
        Object.keys(inputs).forEach((coin) => {
          const qty = inputs[coin];
          const price = prices[coin] ? prices[coin][currency] : 0;
          const value = qty * price;
          // Determine suffix for display
          const suffix = currency === 'KRW' ? ' 원' : ' USD';
          if (qty > 0) {
            const tr = document.createElement('tr');
            const coinLabel = `${coinNames[coin] || coin} (${coin})`;
            tr.innerHTML = `
              <td>${coinLabel}</td>
              <td>${qty.toLocaleString()}</td>
              <td>${formatPrice(price, currency, coin)}${suffix}</td>
              <td>${formatCurrency(value, currency)}${suffix}</td>
            `;
            tbody.appendChild(tr);
          }
          totalValue += value;
        });
        const suffixTotal = currency === 'KRW' ? ' 원' : ' USD';
        document.getElementById('currentTotal').textContent = `${formatCurrency(totalValue, currency)}${suffixTotal}`;
      }

      /**
       * Fetches current prices and updates both the cache and the table.
       */
      async function fetchAndUpdateCurrentTable() {
        const prices = await fetchCurrentPrices();
        if (prices) {
          lastPrices = prices;
          updateCurrentTable(prices);
        }
      }

      /**
       * Starts the countdown timer and periodic price updates.
       */
      function startAutoRefresh() {
        let remaining = 30;
        // Clear existing interval if any
        if (window._countdownInterval) clearInterval(window._countdownInterval);
        window._countdownInterval = setInterval(() => {
          remaining -= 1;
          if (remaining <= 0) {
            remaining = 30;
            fetchAndUpdateCurrentTable();
          }
          document.getElementById('countdown').textContent = remaining;
        }, 1000);
        // Initial fetch and update
        fetchAndUpdateCurrentTable();
      }

      // ------------------------------
      // Copy current link with query parameters
      // ------------------------------
      function copyCurrentLink() {
        const params = new URLSearchParams();
        ['btc','eth','xrp','xlm','ada','trx','etc','bch','bnb','shib'].forEach((id) => {
          const val = document.getElementById(id).value;
          if (val && val !== '0') params.set(id.toUpperCase(), val);
        });
        params.set('currency', document.getElementById('currencySelect').value);
        const url = `${window.location.origin}${window.location.pathname}?${params.toString()}`;
        navigator.clipboard.writeText(url).then(() => {
          alert('링크가 클립보드에 복사되었습니다.');
        });
      }

      // ------------------------------
      // Initialization: parse query params and set values
      // ------------------------------
      function initializeFromQuery() {
        const urlParams = new URLSearchParams(window.location.search);
        ['BTC','ETH','XRP','XLM','ADA','TRX','ETC','BCH','BNB','SHIB'].forEach((key) => {
          const val = urlParams.get(key);
          if (val) document.getElementById(key.toLowerCase()).value = val;
        });
        const currency = urlParams.get('currency');
        if (currency === 'USD' || currency === 'KRW') {
          document.getElementById('currencySelect').value = currency;
        }
      }

      // Event listeners
      document.getElementById('currencySelect').addEventListener('change', () => {
        updateHistoricalTables();
        // Recompute values using cached prices for new currency selection
        updateCurrentTable();
        saveInputsToStorage();
      });
      document.getElementById('saveBtn').addEventListener('click', () => {
        saveInputsToStorage();
        showSaveStatus('저장됨');
      });

      document.getElementById('loadBtn').addEventListener('click', () => {
        const loaded = loadInputsFromStorage();
        if (loaded) {
          updateHistoricalTables();
          updateCurrentTable();
          showSaveStatus('불러오기 완료');
        } else {
          showSaveStatus('저장된 값이 없습니다');
        }
      });

      document.getElementById('resetBtn').addEventListener('click', () => {
        if (!confirm('화면의 전체 보유 수량을 초기화할까요? 저장된 값은 지워지지 않습니다.')) return;
        inputIds.forEach((id) => {
          document.getElementById(id).value = '';
          const changeEl = document.getElementById(`change_${id}`);
          if (changeEl) changeEl.value = '0';
        });
        updateCurrentTable();
        showSaveStatus('초기화됨 · 저장값은 유지됨');
      });

      document.getElementById('applyAllBtn').addEventListener('click', applyAllQuantityChanges);

      // Whenever any input changes, update the current values immediately.
      // Values are stored only when the user presses the 저장 button.
      inputIds.forEach((id) => {
        document.getElementById(id).addEventListener('input', () => {
          updateCurrentTable();
        });
      });

      // On page load
      window.addEventListener('DOMContentLoaded', () => {
        const logoEl = document.getElementById('brandLogo');
        if (logoEl && BRAND_LOGO_DATA.startsWith('data:image')) {
          logoEl.src = BRAND_LOGO_DATA;
        } else if (logoEl) {
          // fallback to file
          logoEl.src = 'logo.png';
        }
        buildChangeControls();
        initializeFromQuery();
        // If no query params, restore previous inputs from localStorage
        if (!window.location.search || window.location.search === '?') {
          loadInputsFromStorage();
        }
        updateHistoricalTables();
        startAutoRefresh();
      });
    </script>
  </body>
</html>
